- {type: models, dur: 5.2, glbs: &glbs [assets/robot.glb, ../../shorts/gta-frog/frog.glb, ../../shorts/concrete-cat/cat.glb,
                                       ../../shorts/playground-serpent/assets/dragon.glb, ../../artist-who-couldnt-create/capture/jet/model.glb]}
- {type: line, dur: 3.8, glbs: *glbs}
- {type: logo, dur: 7.1, logo: assets/logo.png, line: 3D in 3 Clicks, url: Vi3W.in, clicks: [0.3, 0.65, 1.0]}

titles:
- {from: 0, to: 2.4, text: "He drew this.", y: 420, size: 128}

counters:
- {from: 5.0, to: 10.1, label: "TUTORIAL", a: 1, b: 47}

vo:
- {at: 3.45, text: Every idea starts flat., accent: [flat]}
- {at: 5.1, text: For most people, 3D was a wall., accent: [wall]}
- {at: 8.2, text: Hundreds of hours. Software that fights back.}
- {at: 11.4, text: So the best ideas stayed on paper., accent: [paper]}
- {at: 24.2, text: And then… flat became real., accent: [real]}
- {at: 31.9, text: Holdable., accent: [holdable]}
- {at: 34.5, text: Playable., accent: [playable]}
- {at: 36.9, text: Yours., accent: [yours]}
- {at: 44.3, text: Every idea you never built…}
- {at: 49.6, text: …is one sketch away., accent: [sketch]}
- {at: 54.4, text: Vi3W. 3D in three clicks., hide: true}

