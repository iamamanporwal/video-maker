  tick: ["fast ticking clock, tense, steady ticks, close and dry", 5.0]
  click: ["single crisp computer mouse click, close microphone, very clean, no room", 0.5]
  scan: ["soft futuristic digital scanning sweep, subtle UI hum", 1.6]
  riser: ["short cinematic tension riser building fast", 1.8]
  boom: ["deep cinematic sub boom impact with a long warm tail", 3.0]
  printer: ["3D printer stepper motors whirring and buzzing rhythmically, close up", 3.0]

