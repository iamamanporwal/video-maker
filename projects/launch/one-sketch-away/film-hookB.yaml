# Vi3W launch film "ONE SKETCH AWAY" (about 60 s, 9:16).
# Third-party footage: every creator below gave permission (user confirmed 2026-10-29); see RIGHTS.md.
# Game footage: creators agreed to be featured (see projects/shorts/*/reel.yaml).
title: one-sketch-away-hookB
fps: 30
# Laura (the channel's voice) at v3 "Natural" stability: warmer and steadier than the reels' excited read.
voice: {stability: 0.5}

shots:
# ACT 1 · hook B: open on the kid's reaction, then his flat drawing (I Like To Make Stuff, already permitted).
- {type: clip, src: sources/iltms/src.mp4, in: 376.0, dur: 2.4, focus: 0.8, zoom: [1.15, 1.05], credit: "🎥 I Like To Make Stuff"}
- {type: image, src: assets/robot-drawing.png, paper: true, dur: 2.6, zoom: [1.15, 1.0], credit: "🎥 I Like To Make Stuff"}
# ACT 2 · the wall
- {type: clip, src: sources/twoam/src.mp4, in: 158.0, dur: 1.6, focus: 0.35, credit: "🎥 2AM"}
- {type: clip, src: sources/twoam/src.mp4, in: 440.0, dur: 1.5, focus: 0.42, credit: "🎥 2AM"}
- {type: clip, src: sources/twoam/src.mp4, in: 752.5, dur: 1.5, focus: 0.35, focus_y: 0.65, zoom: [1.25, 1.35], credit: "🎥 2AM"}
- {type: clip, src: sources/abbitt/src.mp4, in: 300.0, dur: 1.2, focus: 0.82, credit: "🎥 Grant Abbitt"}
- {type: clip, src: sources/iltms/src.mp4, in: 30.5, dur: 1.6, focus: 0.45, zoom: [1.0, 1.1], credit: "🎥 I Like To Make Stuff"}
- {type: image, src: assets/robot-drawing.png, paper: true, dur: 2.4, zoom: [1.0, 1.12], credit: "🎥 I Like To Make Stuff"}
- {type: black, dur: 1.0}
# ACT 3 · three clicks
# Real Vi3W chain on the kid's drawing (Input/robot0.jpeg, robot1.jpeg, robot.glb): sketch → image → color → 3D.
- {type: count, n: 1, label: SKETCH → IMAGE, dur: 0.7}
- {type: scan, phase: scan, before: assets/robot-drawing.png, after: assets/robot0.jpeg, label: REAL Vi3W OUTPUT, dur: 2.6}
- {type: count, n: 2, label: ADD COLOR, dur: 0.7}
- {type: scan, phase: scan, before: assets/robot0.jpeg, after: assets/robot1.jpeg, label: REAL Vi3W OUTPUT, dur: 2.0}
- {type: count, n: 3, label: MAKE IT 3D, dur: 0.7}
- {type: scan, phase: model, before: assets/robot-drawing.png, glb: assets/robot.glb, label: REAL Vi3W 3D MODEL, dur: 1.6}
# ACT 4 · flat becomes real (the drop)
- {type: clip, src: sources/lostintech/src.mp4, in: 350.0, dur: 1.8, focus: 0.5, credit: "🎥 Lost In Tech"}
- {type: clip, src: sources/iltms/src.mp4, in: 229.3, dur: 1.6, focus: 0.45, credit: "🎥 I Like To Make Stuff"}
- {type: clip, src: sources/dragon/src.mp4, in: 18.0, dur: 1.2, focus: 0.5, credit: "🎥 Jon Stern"}
- {type: clip, src: sources/iltms/src.mp4, in: 231.6, dur: 1.3, focus: 0.55, credit: "🎥 I Like To Make Stuff"}
- {type: clip, src: sources/iltms/src.mp4, in: 357.0, dur: 1.8, focus: 0.45, zoom: [1.0, 1.15], credit: "🎥 I Like To Make Stuff"}
- {type: clip, src: sources/iltms/src.mp4, in: 375.5, dur: 2.6, focus: 0.8, zoom: [1.05, 1.12], credit: "🎥 I Like To Make Stuff"}
- {type: clip, src: "../../../Input/DoodleDerby_trailer (1).mp4", in: 33.0, dur: 2.2, focus: 0.5, focus_y: 0.3, zoom: [1.35, 1.45], credit: "🎮 Doodle Derby · Sagar Prema Rajan"}
- {type: clip, src: "../../../Input/Screen Recording 2026-10-25 at 10.12.46 PM.mov", in: 47.6, dur: 1.3, focus: 0.5, credit: "🎮 Heli Rush"}
- {type: clip, src: "../../../Input/Screen Recording 2026-10-25 at 10.19.08 PM.mov", in: 17.0, dur: 1.2, focus: 0.5, credit: "🎮 Neon Drift"}
- {type: clip, src: "../../../Input/Screen Recording 2026-10-25 at 10.29.58 PM.mov", in: 31.0, dur: 1.2, focus: 0.5, credit: "🎮 Street Dodge"}
- {type: clip, src: "../../../Input/Screen Recording 2026-10-25 at 10.25.35 PM.mov", in: 3.5, dur: 1.2, focus: 0.5, credit: "🎮 Coin Rush"}
- {type: clip, src: "../../../Input/Screen Recording 2026-10-25 at 10.18.07 PM.mov", in: 0.0, dur: 1.2, focus: 0.5, credit: "🎮 Neon Velocity"}
- {type: clip, src: "../../../Input/DoodleDerby_trailer (1).mp4", in: 44.0, dur: 1.2, focus: 0.5, focus_y: 0.3, zoom: [1.4, 1.4], credit: "🎮 Doodle Derby · Sagar Prema Rajan"}
