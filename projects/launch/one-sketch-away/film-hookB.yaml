# Free music (no spend): "High Impact" by ArcticFoxMusic, https://youtu.be/cypqGpxAX_0. Free on every platform with
# credit; the credit goes in the post caption (see RIGHTS.md). Track map: hit 1.0, quiet tension 5-21, hit + build 22-31,
# drop 34-77. Re-cut to the film; splices sit under the silent beat (15.8), the boom (24.1), a whoosh (43.9) and the
# logo clicks (53.9). The drop is ~12 dB hotter than the quiet parts, hence the gains.
music:
  source: sources/music-highimpact/src.mp3
  volume: 0.55
  duck: 0.42
  edit:
  - {from: 5.5, to: 20.3, at: 0.0, gain: -6, fade_in: 1.0, fade_out: 0.7}
  - {from: 21.95, to: 30.25, at: 15.8, gain: -5, fade_in: 0.02}
  - {from: 33.9, to: 53.7, at: 24.1, gain: -5, fade_in: 0.02, fade_out: 0.8}
  - {from: 9.0, to: 19.0, at: 43.9, gain: -3, fade_in: 0.4, fade_out: 0.4}
  - {from: 0.85, to: 6.95, at: 53.9, gain: -8, fade_in: 0.01, fade_out: 2.0}
