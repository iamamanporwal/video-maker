# Roblox anime-meme short 1: "my sketch unlocked its FINAL FORM". Shonen power-up format, three forms.
# Hook: original character, Turbo MLX (gen/powerup.png → LTX image-to-video gen/powerup.mp4). Rights: ours.
# Forms: Sagar Prema Rajan's rocket-sneaker sketch → real Vi3W model → his Doodle Derby gameplay (featured with consent).
# Music (in-app): calm bed until the reveal, hard drop at "FORM 2" (~3.4 s).
title: roblox-final-form
voice: {id: SOYHLrjzK2X1ezoPC6cr, model: eleven_v3, stability: 0.0}   # "Harry": young, rough, animation-style (premade ElevenLabs voice)
hook: {text: my sketch unlocked its *FINAL FORM* 😤, seconds: 3.0}
credit: 'Game: Doodle Derby by Sagar Prema Rajan'
segments:
