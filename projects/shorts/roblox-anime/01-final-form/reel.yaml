- {id: reveal, type: reveal, before: ../../../launch/one-sketch-away/assets/sneaker-sketch.png, after: ../../../launch/one-sketch-away/assets/sneaker-3d.png, seconds: 4.4, label: 'FORM 2 · real Vi3W 3D model'}
- {id: game, type: clip, src: ../../../../Input/DoodleDerby_trailer (1).mp4, in: 25.0, out: 29.2, fit: crop, focus: 0.5, zoom: 1.1, label: 'FINAL FORM · in a real game'}
- {id: cta, type: cta, seconds: 3.4, after: ../../../launch/one-sketch-away/assets/sneaker-3d.png, line: 'Sketch → *3D* with Vi3W', button: 'Comment your final form 👇'}
