# water by the puppies (~7 s) and throws a manhole cover at a car. The first 7 s (no frog) are skipped.
title: gta-frog-ep3-questioned
source: {url: 'https://www.youtube.com/shorts/YTppMLRfBAI', creator: '@AvunHub', rights: permission, proof: ../assets/permission.md}
hook: {text: 'Modders, you need *this* 🐸', seconds: 2.4}
