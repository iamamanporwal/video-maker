# Body of 09 (v2): hook = Blender struggle only (F-22 timelapse + raging streamer), then the founder's REAL Vi3W demo
# (Input/demo1.mp4): app on top, his face cam (cropped from the same recording, same timestamps) below; then the
# finished jet rotating full screen.
out: assets/body.mp4
shots:
- dur: 3.8
  top:    {src: ../ref/bl-jet.mp4, in: 40, speed: 40, zoom: 1.25, focus: 0.45}
  bottom: {src: ../ref/asian.mp4, in: 0.0, gain: 0.45, focus: 0.5}
- dur: 1.2      # crash
  top:    {src: ../ref/bl-jet.mp4, in: 380, freeze: true, zoom: 1.25, focus: 0.45, fx: [red, shake]}
  bottom: {src: ../ref/asian.mp4, in: 3.7, gain: 0.5, focus: 0.5, fx: [shake]}
- dur: 3.0      # sketch
  top:    {src: ../../../../Input/demo1.mp4, in: 0.5, crop: [0.03, 0.17, 0.47, 0.7]}
  bottom: {src: ../../../../Input/demo1.mp4, in: 0.5, crop: [0.655, 0.03, 0.32, 0.32]}
- dur: 2.4      # image
  top:    {src: ../../../../Input/demo1.mp4, in: 58.0, crop: [0.03, 0.12, 0.6, 0.8]}
  bottom: {src: ../../../../Input/demo1.mp4, in: 58.0, crop: [0.655, 0.03, 0.32, 0.32]}
- dur: 2.4      # 3D
  top:    {src: ../../../../Input/demo1.mp4, in: 4.0, crop: [0.5, 0.36, 0.46, 0.5]}
  bottom: {src: ../../../../Input/demo1.mp4, in: 4.0, crop: [0.655, 0.03, 0.32, 0.32]}
- dur: 3.8      # the result: jet rotating
  full:   {src: ../../../../Input/demo1.mp4, in: 6.4, crop: [0.535, 0.37, 0.415, 0.46], fit: contain, bg: "0x404040"}
