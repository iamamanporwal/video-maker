# Body of 08 (v2): hook = Blender struggle only (Audi timelapse + Korean rage), then the Vi3W flow (demo3) with
# Keyboard Dog vibing, then the finished car rotating full screen in the Vi3W viewer.
out: assets/body.mp4
shots:
- dur: 3.8
  top:    {src: ../ref/bl-car.mp4, in: 100, speed: 40, zoom: 1.3, focus: 0.45}
  bottom: {src: ../ref/korean.mp4, in: 1.0, gain: 0.12, focus: 0.5}
- dur: 1.2      # crash
  top:    {src: ../ref/bl-car.mp4, in: 400, freeze: true, zoom: 1.3, focus: 0.45, fx: [red, shake]}
  bottom: {src: ../ref/korean.mp4, in: 3.0, gain: 0.12, focus: 0.5, fx: [shake]}
- dur: 3.0
  top:    {src: ../../../../Input/demo3.mp4, in: 0.0, speed: 0.6, zoom: 1.15, focus: 0.08, focus_y: 0.6}
  bottom: {src: ../ref/kbdog.mp4, in: 0.6, gain: 0.8, focus: 0.5}
- dur: 2.4
  top:    {src: assets/car-image.png}
  bottom: {src: ../ref/kbdog.mp4, in: 3.6, gain: 0.8, focus: 0.5}
- dur: 2.2
  top:    {src: ../../../../Input/demo3.mp4, in: 13.6, zoom: 1.25, focus: 0.3, focus_y: 0.55}
  bottom: {src: ../ref/kbdog.mp4, in: 6.0, gain: 0.8, focus: 0.5}
- dur: 4.0      # the result: car rotating, solid → wireframe → normals
  full:   {src: ../../../../Input/demo3.mp4, in: 14.4, crop: [0.08, 0.12, 0.62, 0.8], fit: contain, bg: "0x404040"}
