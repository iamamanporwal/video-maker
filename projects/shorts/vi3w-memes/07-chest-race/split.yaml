# Body of 07 (v2): hook = Blender struggle only (0-5 s), then the Vi3W flow with Keyboard Cat vibing, then the
# finished chest spinning full screen. Vi3W footage = Input/Demo 1.mp4 (real capture).
out: assets/body.mp4
shots:
# --- hook: Blender struggle, no text ---
- dur: 3.8
  top:    {src: ../ref/bl-chest.mp4, in: 10, speed: 30, zoom: 1.25, focus: 0.4}
  bottom: {src: ../../blender-vs-vi3w/ref/monkey.mp4, in: 2.8, gain: 1.0}
- dur: 1.2      # crash
  top:    {src: ../ref/bl-chest.mp4, in: 280, freeze: true, zoom: 1.25, focus: 0.4, fx: [red, shake]}
  bottom: {src: ../../blender-vs-vi3w/ref/monkey.mp4, in: 1.3, gain: 1.0, fx: [shake]}
# --- Vi3W: sketch → describe → image → 3D, Keyboard Cat vibing ---
- dur: 3.6
  top:    {src: "../../../../Input/Demo 1.mp4", in: 0.3, speed: 0.8, zoom: 1.35, focus: 0.85}
  bottom: {src: ../ref/kbcat.mp4, in: 0.0, gain: 0.8, focus: 0.4}
- dur: 2.0
  top:    {src: "../../../../Input/Demo 1.mp4", in: 4.8, zoom: 1.1, focus: 0.0, focus_y: 0.55}
  bottom: {src: ../ref/kbcat.mp4, in: 3.6, gain: 0.8, focus: 0.4}
- dur: 2.0
  top:    {src: "../../../../Input/Demo 1.mp4", in: 9.4, zoom: 1.1, focus: 1.0, focus_y: 0.55}
  bottom: {src: ../ref/kbcat.mp4, in: 5.6, gain: 0.8, focus: 0.4}
- dur: 2.0
  top:    {src: "../../../../Input/Demo 1.mp4", in: 12.2, zoom: 1.1, focus: 0.15, focus_y: 0.5}
  bottom: {src: ../ref/kbcat.mp4, in: 7.6, gain: 0.8, focus: 0.4}
# --- the result: chest spinning full screen ---
- dur: 3.6
  full:   {src: "../../../../Input/Demo 1.mp4", in: 19.8, speed: 0.4, crop: [0.22, 0.04, 0.62, 0.92], fit: contain, bg: "0x090b0d"}
