# 01-learning-3d: "learning 3D be like" mashup of three 1M+ Blender-pain Shorts → real Vi3W flow → CTA.
# 0-6 s hook: anime girl fights Blender's save dialog (no text until 4.6). 6-17 s DAY 1/30/90 escalation + crash.
# 17-21 s she escapes Blender. 21.5-31 s REAL Vi3W flow (Input/Demo 1.mp4). 31-35 s chest spins. CTA.
# Cleared: all three creators gave blanket permission (2026-11-02, see ../RIGHTS.md).
title: vi3w-learning-3d
