[project]
name = "reelforge"
version = "0.1.0"
description = "AI-directed product-film pipeline: Python does the operations, Claude makes the decisions."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.70",
  "pydantic>=2.7",
  "pyyaml>=6",
  "numpy>=1.26",
  "pillow>=10",
  "httpx>=0.27",
  "mcp>=2.3",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
reelforge = "reelforge.cli:main"
reelforge-mcp = "reelforge.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reelforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
